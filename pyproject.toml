# qwentin -- project metadata and the pinned runtime dependencies of tools/*.py.
#
# The engine is a CUDA shared library (CMakeLists.txt -> build-qwen/libforward_qwen.so) loaded through ctypes by the
# scripts in tools/, which are run from the checkout (python3 tools/serve_batched.py ...); nothing here is importable
# as a package. `pip install -e .` therefore installs only the dependencies below (no packages are built).
# requirements.txt mirrors this list for `pip install -r`.
#
# The pins are the versions every 2026-10-17 number was measured with (docs/evidence/README.md): torch 2.14.0 from the
# CUDA 13.0 wheel index (torch==2.14.0+cu130 -- install it with
#   pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cu130
# before the rest, PyPI's default wheel is a different CUDA build), transformers 5.17.0, safetensors 0.8.0, numpy 2.5.3.
# Python 3.14.4 was used; the code needs >= 3.10 (PEP 604 unions, dataclasses, match-free).

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qwentin"
version = "0.13.0"
description = "Qwen3.6/3.8-27B inference engine for one SM120 GPU: EXL3 trellis weights, trellis-coded KV cache, speculative decoding, OpenAI API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "kacper-daftcode" }]
urls = { Homepage = "https://github.com/kacper-daftcode/qwentin" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    # tools/convert_qwen_tqf.py, qwentin_e2e.py, exl3_diff.py, e2e_frontier.py, paged_logit_ab.py, ...
    "torch==2.14.0",            # +cu130 build: see the header
    # every server / engine tool (AutoTokenizer, AutoConfig, chat templates)
    "transformers==5.17.0",
    # tools/convert_qwen_tqf.py, dequant_fp8_to_bf16.py
    "safetensors==0.8.0",
    # tools/convert.py, convert_qwen_tqf.py, sparse_pack.py
    "numpy==2.5.3",
    # tools/harness_common.py and the HTTP verification tools (code_needle.py, spec_speed.py, spec_server_ab.py)
    "httpx==0.28.1",
    # tools/harness_common.py: exact prompt sizing from tokenizer.json (a transformers dependency, pinned explicitly)
    "tokenizers==0.23.2",
]

[project.optional-dependencies]
# docs/QUALITY.md: the yardstick needs exllamav3 (upstream commit 02aef45 or newer, from source:
#   pip install -e /path/to/exllamav3   or   tools/exl3_diff.py --exllamav3 /path/to/checkout
# -- not on PyPI at that commit, so it is not listed here), EvalPlus for T1, lm-eval for the perplexity TODO, and
# PyYAML for the per-tensor bitrate recipes in tools/recipes/ (read by exllamav3's convert.py -rcp).
quality = [
    "pyyaml==6.0.3",
    "evalplus",
    "lm-eval",
]
dev = [
    "ruff==0.17.1",
    "pytest==9.1.1",
]

[tool.setuptools]
packages = []

[tool.ruff]
# CI lints tools/ and tests/ (.github/workflows/ci.yml). Minimal: pyflakes + the syntax / semantic pycodestyle groups;
# the house style (one-line `a; b` statements, `import a, b`, imports after sys.path edits, `l` as a loop name) is kept.
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
ignore = ["E401", "E402", "E701", "E702", "E731", "E741"]
